# Daily, or started by hand (Actions -> Refresh data and deploy -> Run workflow): rebuild
# the data snapshot with fresh prices, build the site and publish it on GitHub Pages.
# A push to main does not deploy; code changes go live with the next run.
# The CI checks (ci.yml) run first; if one fails, nothing is deployed and the site stays as
# it was.
# Requires Settings -> Pages -> Source: "GitHub Actions".
name: Refresh data and deploy

on:
  schedule:
    - cron: '30 4 * * *' # once a day; Scryfall's bulk data and the decklists change daily
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  checks:
    name: Checks
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Build and deploy
    needs: checks
    runs-on: ubuntu-latest
    # Only this job may publish to GitHub Pages
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Cache downloads and pack images
        uses: actions/cache@v4
        with:
          path: |
            pipeline/.cache
            web/public/images
          key: pipeline-${{ github.run_id }}
          restore-keys: pipeline-
      - run: pip install -c pipeline/requirements-pinned.txt -e ./pipeline
      - name: Build data snapshot
        run: python -m rotation_radar build --root .
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
        env:
          # An own domain: the repository variable SITE_URL (e.g. https://deckade.de), with the
          # same domain under Settings > Pages > Custom domain. Without it the site lives at
          # <owner>.github.io/<repository>/.
          SITE_URL: ${{ vars.SITE_URL || format('https://{0}.github.io', github.repository_owner) }}
          BASE_PATH: ${{ vars.SITE_URL && '/' || format('/{0}/', github.event.repository.name) }}
          # Shown in the imprint and privacy notice; set under Settings > Secrets and variables > Variables
          OPERATOR_NAME: ${{ vars.OPERATOR_NAME }}
          OPERATOR_ADDRESS: ${{ vars.OPERATOR_ADDRESS }}
          OPERATOR_EMAIL: ${{ vars.OPERATOR_EMAIL }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist
      - id: deployment
        uses: actions/deploy-pages@v4
