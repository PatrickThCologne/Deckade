name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The deployment runs these checks first and stops if one fails (deploy.yml)
  workflow_call:

permissions:
  contents: read

# A newer push to a pull request cancels its older run; runs on main all finish, so each commit
# there keeps its result. When deploy.yml calls this workflow, github.workflow is the caller's
# name, so the deployment's checks are in a group of their own.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pipeline:
    name: Pipeline (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            pipeline/pyproject.toml
            pipeline/requirements-pinned.txt
      # The tested versions of all packages (requirements-pinned.txt), not the newest ones
      - run: pip install -c requirements-pinned.txt -e ".[dev]"
      - run: ruff check src tests
      - run: ruff format --check src tests
      - run: mypy
      - run: pytest

  web:
    name: Website (Astro)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      # The small contract snapshot written by the pipeline's tests (tests/contract) stands in
      # for live data: fast and reproducible. Live data is only fetched by the deployment.
      - run: npm run fixture
      # The rules that keep the coding agents in .claude/agents to their part of the work
      - name: Agent guard rules
        run: node --test .claude/hooks/agent-guard-rules.test.mjs
        working-directory: .
      - run: npm ci
      - run: npm run lint
      - run: npm run check
      - run: npm test
      - run: npm run build
      # Lighthouse checks the built pages (lighthouserc.json): accessibility, best practices and
      # SEO fail the job below their minimum; performance only warns, as shared runners vary.
      # The reports are kept as the run's "lighthouse" artifact.
      - run: npx --yes @lhci/cli@0.15.1 autorun
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: lighthouse
          path: web/lighthouse
          if-no-files-found: ignore
