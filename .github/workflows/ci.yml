name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The deployment runs these checks first and stops if one fails (deploy.yml)
  workflow_call:

jobs:
  pipeline:
    name: Pipeline (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pipeline/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check src tests
      - run: ruff format --check src tests
      - run: mypy
      - run: pytest

  web:
    name: Website (Astro)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      # The small contract snapshot written by the pipeline's tests (tests/contract) stands in
      # for live data: fast and reproducible. Live data is only fetched by the deployment.
      - run: mkdir -p src/data && cp -r tests/contract src/data/generated
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run check
      - run: npm test
      - run: npm run build
