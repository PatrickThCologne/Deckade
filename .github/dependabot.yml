# Monthly version updates, one grouped pull request per ecosystem. CI (ci.yml) checks each.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      github-actions:
        patterns: ['*']
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    # Majors come one by one, so a breaking one does not hold back the others.
    # TypeScript 7 waits until @astrojs/check allows it (its peer range ends at 6).
    groups:
      npm:
        patterns: ['*']
        update-types: [minor, patch]
    ignore:
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: pip
    directory: /pipeline
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      pip:
        patterns: ['*']
    commit-message:
      prefix: chore
      include: scope
